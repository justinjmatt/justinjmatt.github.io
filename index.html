<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Justin James Matt</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #111;
    }

    h1 { margin-bottom: 5px; }
    h2 { margin-top: 0; color: #555; font-weight: normal; }

    .controls {
      margin: 30px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    select, button {
      padding: 6px 10px;
      margin-right: 10px;
      margin-top: 5px;
    }

    .pub {
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .title {
      font-weight: bold;
    }

    .meta {
      color: #555;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      padding: 2px 6px;
      background: #eee;
      border-radius: 4px;
      margin-left: 5px;
      text-transform: capitalize;
    }

    .links a {
      display: inline-block;
      font-size: 13px;
      margin-right: 10px;
      margin-top: 4px;
      color: #0056b3;
      text-decoration: none;
      border: 1px solid #0056b3;
      padding: 3px 8px;
      border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }

    .links a:hover {
      background: #0056b3;
      color: #fff;
    }
    
    .links a.pdf-link {
      background: #fdfdfd;
      border-color: #d9534f;
      color: #d9534f;
    }
    .links a.pdf-link:hover {
      background: #d9534f;
      color: #fff;
    }
  </style>
</head>

<body>

<h1>Justin James Matt</h1>
<h2>Research Scientist</h2>

<div class="controls">
  <div>
    <strong>Sort by:</strong>
    <select id="sortSelect">
      <option value="year-desc">Year (new → old)</option>
      <option value="year-asc">Year (old → new)</option>
      <option value="alpha-asc">Author (A → Z)</option>
      <option value="alpha-desc">Author (Z → A)</option>
    </select>
  </div>

  <div>
    <strong>Filter type:</strong>
    <select id="typeFilter">
      <option value="all">All</option>
      <option value="journal">Journal</option>
      <option value="conference">Conference</option>
      <option value="technical report">Technical Report</option>
    </select>

    <strong>Authorship:</strong>
    <select id="authorFilter">
      <option value="all">All papers</option>
      <option value="first">First author only</option>
      <option value="not-first">Not first author</option>
    </select>

    <button onclick="render()">Apply</button>
  </div>
</div>

<h3>Publications</h3>
<div id="list"></div>

<script>
let publications = [];

async function loadData() {
  try {
    const res = await fetch("publications.json", { cache: "no-store" });
    publications = await res.json();
    render();
  } catch (err) {
    document.getElementById("list").innerHTML =
      "<p style='color:red;'>Failed to load publications.json :(</p>";
    console.error(err);
  }
}

loadData();

function isFirstAuthor(authors) {
  if (!authors) return false;
  return authors.split(";")[0].toLowerCase().includes("matt, justin");
}

function render() {
  const sortMode = document.getElementById("sortSelect").value;
  const typeFilter = document.getElementById("typeFilter").value;
  const authorFilter = document.getElementById("authorFilter").value;

  let list = [...publications];

  // filter type (using the new "type" field from the metadata)
  list = list.filter(p => {
    const type = p.type ? p.type.toLowerCase() : "other";
    return typeFilter === "all" || type === typeFilter;
  });

  // filter author
  list = list.filter(p => {
    const first = isFirstAuthor(p.authors);
    if (authorFilter === "first") return first;
    if (authorFilter === "not-first") return !first;
    return true;
  });

  // sort
  list.sort((a, b) => {
    if (sortMode === "year-desc") return b.year - a.year;
    if (sortMode === "year-asc") return a.year - b.year;
    if (sortMode === "alpha-asc") return a.authors.localeCompare(b.authors);
    if (sortMode === "alpha-desc") return b.authors.localeCompare(a.authors);
    return 0;
  });

  const container = document.getElementById("list");
  container.innerHTML = "";

  list.forEach(p => {
    const div = document.createElement("div");
    div.className = "pub";

    // Format extra venue info like volume, number, pages
    let venueDetails = p.venue || "";
    if (p.volume) venueDetails += `, Vol. ${p.volume}`;
    if (p.number) venueDetails += `, No. ${p.number}`;
    if (p.pages) venueDetails += `, pp. ${p.pages}`;

    // Build the Links HTML
    let linksHtml = "";
    if (p.pdf || p.doi || p.preprint) {
      linksHtml += `<div class="links">`;
      if (p.pdf) {
        // Appends "pdfs/" folder path to the filename from JSON
        linksHtml += `<a href="pdfs/${p.pdf}" target="_blank" class="pdf-link">PDF (Accepted Manuscript)</a>`;
      }
      if (p.doi) {
        linksHtml += `<a href="${p.doi}" target="_blank">Official Publication</a>`;
      }
      if (p.preprint) {
        linksHtml += `<a href="${p.preprint}" target="_blank">Pre-print</a>`;
      }
      linksHtml += `</div>`;
    }

    div.innerHTML = `
      <div class="title">${p.title}</div>
      <div class="meta">
        ${p.authors}<br/>
        ${venueDetails} ${p.year ? "(" + p.year + ")" : ""}
        <span class="tag">${p.type || "Other"}</span>
      </div>
      ${linksHtml}
    `;

    container.appendChild(div);
  });
}
</script>

</body>
</html>
